<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>nexus-home-3d · harness</title>
<style>
  body{margin:0;background:#02040a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#8fa6b7}
  .wrap{width:min(1200px,calc(100% - 16px));margin:16px auto}
  .label{font:11px/1.6 ui-monospace,monospace;color:#4a5e70;letter-spacing:.1em;margin:18px 0 8px}
  #editor-host{width:100%;max-width:820px;background:#0b1017;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">CARD · nexus-home-3d</div>
  <div id="card-host" style="width:100%;height:620px"></div>
  <div class="label">EDITOR · nexus-home-3d-editor</div>
  <div id="editor-host"></div>
</div>

<script type="module">
import "../nexus-home-3d.js";

const states = {
  "light.living_room": { state: "on", attributes: { brightness: 199 } },
  "switch.living_scene": { state: "on", attributes: {} },
  "climate.home": { state: "cool", attributes: { temperature: 22, hvac_mode: "cool" } },
  "sensor.living_temp": { state: "23.4", attributes: { unit_of_measurement: "°C" } },
  "light.master_bedroom": { state: "on", attributes: { brightness: 115 } },
  "climate.master_ac": { state: "cool", attributes: { temperature: 24 } },
  "cover.master_curtain": { state: "open", attributes: { current_position: 80 } },
  "sensor.master_temp": { state: "23.4", attributes: { unit_of_measurement: "°C" } },
  "light.study_desk": { state: "off", attributes: { brightness: 153 } },
  "switch.study_pc": { state: "on", attributes: {} },
  "light.kitchen": { state: "on", attributes: { brightness: 166 } },
  "switch.kitchen_hood": { state: "off", attributes: {} },
  "light.hall": { state: "on", attributes: { brightness: 51 } },
  "cover.garage_door": { state: "closed", attributes: { current_position: 0 } },
  "light.garage": { state: "off", attributes: {} },
  "switch.ev_charger": { state: "on", attributes: {} },
};

window.__calls = [];
const hass = {
  states,
  config: { unit_system: { temperature: "°C" } },
  callService(domain, service, data) {
    window.__calls.push({ domain, service, data });
    // 模拟服务生效：本地改写状态，走真实 hass 回调路径
    const eid = data.entity_id;
    if (!eid || !states[eid]) return;
    const st = states[eid];
    if (service === "turn_on") {
      st.state = "on";
      if (data.brightness_pct != null) st.attributes.brightness = Math.round((data.brightness_pct / 100) * 255);
    }
    if (service === "turn_off") st.state = "off";
    if (service === "set_temperature") st.attributes.temperature = data.temperature;
    if (service === "set_cover_position") {
      st.attributes.current_position = data.position;
      st.state = data.position > 0 ? "open" : "closed";
    }
    if (service === "close_cover") {
      st.attributes.current_position = 0;
      st.state = "closed";
    }
  },
};

const config = {
  type: "custom:nexus-home-3d",
  title: "长乐湾 · 主宅",
  subtitle: "二〇二〇款 锐际 · 家用总览",
  height: 620,
  floors: [
    {
      id: "f2", name: "二层 · 起居", level: 2,
      rooms: [
        { id: "master", name: "主卧", size: "l", entities: { light: "light.master_bedroom", climate: "climate.master_ac", cover: "cover.master_curtain", sensor: "sensor.master_temp" } },
        { id: "study", name: "书房", size: "m", entities: { light: "light.study_desk", switch: "switch.study_pc" } },
      ],
    },
    {
      id: "f1", name: "一层 · 生活", level: 1,
      rooms: [
        { id: "living", name: "客厅", size: "xl", entities: { light: "light.living_room", switch: "switch.living_scene", climate: "climate.home", sensor: "sensor.living_temp" } },
        { id: "kitchen", name: "厨房", size: "m", entities: { light: "light.kitchen", switch: "switch.kitchen_hood" } },
        { id: "hall", name: "玄关", size: "s", entities: { light: "light.hall" } },
      ],
    },
    {
      id: "g0", name: "车库层", level: 0, rooms: [
        { id: "garage", name: "车库", kind: "garage", size: "xl", entities: { cover: "cover.garage_door", light: "light.garage", switch: "switch.ev_charger" } },
      ],
    },
  ],
};

/* ---------- 卡片 ---------- */
const host = document.getElementById("card-host");
const card = document.createElement("nexus-home-3d");
host.appendChild(card);
card.setConfig(config);
card.hass = hass;

/* ---------- 编辑器 ---------- */
const editor = document.createElement("nexus-home-3d-editor");
editor.setConfig(JSON.parse(JSON.stringify(config)));
document.getElementById("editor-host").appendChild(editor);
editor.hass = hass;
window.__editorEvents = [];
editor.addEventListener("config-changed", (event) => {
  window.__editorEvents.push({ floors: event.detail.config.floors.length });
});

/* ---------- 断言 ---------- */
window.__probe = {
  cardTag: !!customElements.get("nexus-home-3d"),
  editorTag: !!customElements.get("nexus-home-3d-editor"),
  registry: (window.customCards || []).map((c) => c.type),
  cardSize: card.getCardSize(),
  grid: card.getGridOptions(),
  // 真实 HA 查找名：strip custom: 后的标签
  lookup: () => customElements.get("nexus-home-3d"),
};
window.__card = card;
window.__editor = editor;
document.title = "harness-ready";
</script>
</body>
</html>
